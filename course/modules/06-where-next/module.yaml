id: "06"
title: Where next
question: Your lab's data isn't two nights of M101. Which part of cuPhoton takes it, and what would you check on the first run?
needs: none   # no runs; the tutor answers from the component briefs in 6.1/tutor.md
objectives: [O7]
misconceptions: []
source: docs/guide/index.qmd ("Find your task") and the guide chapters in the pinned checkout
time: 15–25 min
intro: |
  The course followed one job end to end: two pictures of the sky, what
  changed between them, and how to trust the answer. cuPhoton covers more
  ground than that. This last module is a map: what each part of the library
  takes in, and where its guide chapter starts.

  Then it's your turn to place your own work on it. The habits carry over:
  know what a step should give back, ask for the receipt, check the noise
  model, and test with something whose answer you know.
